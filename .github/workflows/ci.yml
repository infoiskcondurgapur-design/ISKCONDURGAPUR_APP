name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --dir src

      - name: Build
        env:
          JWT_SECRET: ci-placeholder-jwt-secret
          CSRF_SECRET: ci-placeholder-csrf-secret
          MONGODB_URI: mongodb://localhost:27017/ci-placeholder
        run: npm run build
